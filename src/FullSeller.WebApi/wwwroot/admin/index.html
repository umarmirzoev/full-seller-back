<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FULL SELLER — Админ-панель</title>
<style>
:root{--side:#2b1708;--side2:#3f2411;--side-t:#ecdcc8;--bg:#fffbf8;--card:#fff;--text:#1a1410;--muted:#9c8f80;--line:#f2e1ce;--g:#ff6a00;--g-d:#e85d00;--g-l:#fff4ea;--ok:#16a34a;--ok-l:#e7f6ec;--bad:#dc2626;--bad-l:#fdecec;--warn:#ffb020;--warn-l:#fff4de;--blue:#2563eb;--blue-l:#e8f0fe;--vio:#8b5cf6;--r:14px;--sh:0 2px 8px rgba(74,29,2,.06)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* вход */
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login h1{margin:0 0 4px;color:var(--g-d)}
/* каркас */
#appView{display:flex;min-height:100vh}
aside{width:250px;background:var(--side);color:var(--side-t);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none;transition:width .15s;z-index:30}
aside .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;color:#fff;font-weight:800;font-size:18px;letter-spacing:.3px}
aside .brand .lg{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ffb15c,#ff6a00 55%,#ff3d00);display:grid;place-items:center;color:#fff;font-size:15px}
aside nav{flex:1;overflow:auto;padding:8px 10px}
.ni{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;background:none;border:0;color:var(--side-t);cursor:pointer;text-align:left;font-weight:600;font-size:14.5px;margin-bottom:2px}
.ni:hover{background:var(--side2)}
.ni.on{background:linear-gradient(135deg,#ff8a3d,#ff6a00);color:#fff;box-shadow:0 4px 12px rgba(255,106,0,.35)}
.ni .tx{flex:1;white-space:nowrap}
.ni .bd{background:var(--bad);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:11px;font-weight:700;display:grid;place-items:center}
.ni .ch{transition:transform .15s;opacity:.7}
.ni.open .ch{transform:rotate(90deg)}
.sub{display:none;padding:2px 0 6px 0}
.sub.open{display:block}
.sub button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--side-t);padding:8px 12px 8px 44px;border-radius:8px;cursor:pointer;font-size:14px}
.sub button:hover{background:var(--side2)}
.sub button.on{color:#fff;font-weight:700}
aside .foot{padding:10px;border-top:1px solid var(--side2)}
body.collapsed aside{width:68px}
body.collapsed aside .tx,body.collapsed aside .bd,body.collapsed aside .ch,body.collapsed aside .sub,body.collapsed aside .brand span.nm{display:none}
body.collapsed .ni{justify-content:center}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 22px}
header.top h1{margin:0;font-size:20px;white-space:nowrap}
.search{flex:1;max-width:620px;margin:0 auto 0 8px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:10px;background:#fff7f0}
.search svg{position:absolute;left:11px;top:10px;color:var(--muted);width:18px;height:18px}
.ib{position:relative;background:none;border:0;cursor:pointer;color:var(--text);padding:7px;border-radius:9px}
.ib:hover{background:#fff4ea}
.ib .bd{position:absolute;top:0;right:0;background:var(--bad);color:#fff;border-radius:999px;min-width:17px;height:17px;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--g-l);color:var(--g-d);display:grid;place-items:center;font-weight:800}
.me b{display:block;line-height:1.1}.me small{color:var(--muted)}
.burger{display:none}
main{padding:20px 22px 40px;max-width:1500px;width:100%}
/* карточки */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--line)}
.card h3{margin:0 0 12px;font-size:16px}
.card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.card .hd h3{margin:0}
.card .hd a{color:var(--g-d);font-weight:700;cursor:pointer;font-size:13px}
.row{display:grid;gap:14px;margin-bottom:14px}
.c4{grid-template-columns:repeat(4,1fr)}
.top4{grid-template-columns:repeat(4,1fr) 1.9fr}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:1.1fr 1fr 1fr}
.c22{grid-template-columns:1fr 1fr}
.c4b{grid-template-columns:repeat(4,1fr)}
.stat{display:flex;gap:14px;align-items:center}
.ico{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px}
.stat .l{color:var(--muted);font-size:13px}
.stat .n{font-size:28px;font-weight:800;line-height:1.1}
.stat .s{font-size:12.5px;font-weight:600}
.t-g{background:var(--g-l);color:var(--g-d)}.t-b{background:var(--blue-l);color:var(--blue)}.t-w{background:var(--warn-l);color:#b97c00}.t-r{background:var(--bad-l);color:var(--bad)}.t-v{background:#efe9fe;color:var(--vio)}
.s-g{color:var(--g-d)}.s-o{color:var(--ok)}.s-b{color:var(--blue)}.s-w{color:#b97c00}.s-r{color:var(--bad)}
.rev .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rev .cols .l{color:var(--muted);font-size:12.5px}.rev .cols .n{font-size:22px;font-weight:800}.rev .cols .s{font-size:12px;font-weight:600;color:var(--g-d)}
select.mini,.bar select,.bar input{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--g);color:var(--g-d);background:var(--g-l)}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .m{flex:1;min-width:0}
.list .it .m b,.list .it .m span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .m span{color:var(--muted);font-size:12.5px}
.bubble{width:38px;height:38px;border-radius:50%;background:var(--g-l);color:var(--g-d);display:grid;place-items:center;font-weight:800;flex:none}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}
.p0{background:var(--blue-l);color:var(--blue)}.p1{background:var(--warn-l);color:#b97c00}.p2{background:#efe9fe;color:var(--vio)}.p3{background:var(--ok-l);color:var(--ok)}.p4{background:var(--bad-l);color:var(--bad)}.poff{background:#eceff1;color:#607080}
.hbar{display:flex;align-items:center;gap:10px;margin:9px 0}
.hbar .nm{width:110px;font-size:13px}.hbar .tr{flex:1;background:#fff0e2;border-radius:99px;height:10px;overflow:hidden}.hbar .tr i{display:block;height:100%;border-radius:99px}.hbar .v{width:64px;text-align:right;font-weight:700}
/* таблицы/формы */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.bar input[type=search]{flex:1;min-width:180px}
.btn{background:linear-gradient(135deg,#ff8a3d,#ff6a00);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--g-d)}.btn.ghost,.btn.ghost:hover{background-image:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:#fff4ea}
.btn.bad{background:var(--bad);background-image:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#fff7f0}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#fff7f0}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;color:var(--muted)}
img.th{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--bg);display:block}
.muted{color:var(--muted)}.err{color:var(--bad);margin:8px 0}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.field textarea{min-height:72px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;gap:16px;margin:10px 0;flex-wrap:wrap}.chk label{display:flex;gap:6px;align-items:center}
.modalbg{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--card);border-radius:var(--r);width:100%;max-width:720px;padding:20px}
.modal h2{margin:0 0 12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sbh{margin:16px 0 6px;font-weight:700}
.line{display:grid;gap:8px;grid-template-columns:1fr 1fr 1.2fr 1fr auto;margin-bottom:8px;align-items:center}
.line.t{grid-template-columns:1fr 1fr auto}
.line input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b1708;color:#fff;padding:10px 18px;border-radius:999px;z-index:90;font-weight:600}
.stars{color:var(--warn);letter-spacing:1px}
@media (max-width:1180px){.top4{grid-template-columns:repeat(2,1fr)}.top4>.rev{grid-column:1/-1}.c3{grid-template-columns:1fr 1fr}.c4b{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
 aside{position:fixed;left:-260px;width:250px;transition:left .2s}
 body.menu aside{left:0}
 body.menu::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
 .burger{display:block}.search{display:none}.me div{display:none}
 .c4,.c2,.c3,.c22,.c4b,.top4{grid-template-columns:1fr}
 main{padding:14px}header.top{padding:10px 14px}
 .row2,.row3{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}.line.t{grid-template-columns:1fr 1fr auto}
 body.collapsed aside{width:250px}
}
</style>
</head>
<body>

<div id="loginView" class="login hidden">
  <h1>FULL SELLER</h1>
  <p class="muted">Админ-панель. Войдите номером телефона и паролем администратора.</p>
  <form id="loginForm" class="card" autocomplete="on">
    <label class="field"><span>Телефон</span><input id="lPhone" type="tel" inputmode="tel" placeholder="+992…" autocomplete="username" required></label>
    <label class="field"><span>Пароль</span><input id="lPass" type="password" autocomplete="current-password" required></label>
    <div id="lErr" class="err hidden"></div>
    <button class="btn" style="width:100%" id="lBtn">Войти</button>
  </form>
</div>

<div id="appView" class="hidden">
  <aside>
    <div class="brand"><div class="lg">F</div><span class="nm">Full Seller</span></div>
    <nav id="nav"></nav>
    <div class="foot"><button class="ni" id="collapse"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg><span class="tx">Свернуть</span></button></div>
  </aside>
  <div class="wrap">
    <header class="top">
      <button class="ib burger" id="burger"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="title">Дашборд</h1>
      <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gs" type="search" placeholder="Поиск по заказам и клиентам (Enter)…"></div>
      <button class="ib" id="bell" title="Уведомления"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="bd hidden" id="bellN"></span></button>
      <button class="ib" id="refresh" title="Обновить"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/></svg></button>
      <button class="ib" id="logout" title="Выйти"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg></button>
      <div class="me"><div class="av" id="avL">A</div><div><b id="meN">Admin</b><small id="meR">Администратор</small></div></div>
    </header>
    <main id="main"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast hidden"></div>

<script>
(function(){
'use strict';
var API = location.origin + '/api';
var ORDER_ST = ['Новый','В обработке','В пути','Доставлен','Отменён'];
var ROLES = ['Покупатель','Юр. лицо','Менеджер','Админ','Суперадмин'];
var PAY = ['Карта','Счёт'];
var COUNTRY = ['Россия','Таджикистан'];
var CUR = '₽';
var $ = function(s,r){return (r||document).querySelector(s)};
var state = {};

// ---------- утилиты ----------
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(n){return Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})}
function money(n){return num(n)+' '+CUR}
function pd(s){if(!s)return new Date(0);return new Date(/[zZ]$|[+-]\d\d:\d\d$/.test(s)?s:s+'Z')}
function dt(s){return pd(s).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dlabel(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')}
function lastDays(n){var a=[],t=new Date();t.setHours(0,0,0,0);for(var i=n-1;i>=0;i--){var d=new Date(t);d.setDate(t.getDate()-i);a.push(d)}return a}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.add('hidden')},2600)}
function debounce(fn,ms){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a)},ms)}}
var ICONS={
 dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 orders:'<path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M8 6H6a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-2"/><path d="M9 12h6M9 16h4"/>',
 factory:'<path d="M3 21V10l6 4v-4l6 4V6h3a1 1 0 0 1 1 1v14z"/><path d="M8 17h2M13 17h2"/>',
 box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 5a3.5 3.5 0 0 1 0 7M18 14c2 .6 3.5 2.4 3.5 5"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
 chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
 cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 chev:'<path d="m9 6 6 6-6 6"/>',
 ok:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 x:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>'
};
function ic(n){return '<svg class="i" viewBox="0 0 24 24">'+(ICONS[n]||'')+'</svg>'}

// ---------- токены / api ----------
function getTok(){try{return JSON.parse(localStorage.getItem('fsAdminTok')||'null')}catch(e){return null}}
function setTok(t){try{if(t)localStorage.setItem('fsAdminTok',JSON.stringify(t));else localStorage.removeItem('fsAdminTok')}catch(e){}state.tok=t}
state.tok=getTok();
function jwt(t){try{var p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return {}}}
async function raw(path,opt){
  opt=opt||{};var h={'Accept':'application/json'};
  if(opt.body!==undefined)h['Content-Type']='application/json';
  if(state.tok&&!opt.noAuth)h['Authorization']='Bearer '+state.tok.accessToken;
  var ctl=new AbortController();var to=setTimeout(function(){ctl.abort()},25000);
  try{return await fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body!==undefined?JSON.stringify(opt.body):undefined,signal:ctl.signal,cache:'no-store'})}
  finally{clearTimeout(to)}
}
async function refreshTok(){
  if(!state.tok||!state.tok.refreshToken)return false;
  try{var r=await raw('/auth/refresh',{method:'POST',body:{refreshToken:state.tok.refreshToken},noAuth:true});if(!r.ok)return false;setTok(await r.json());return true}catch(e){return false}
}
async function api(path,opt){
  var r;
  try{r=await raw(path,opt)}catch(e){throw new Error('Нет связи с сервером')}
  if(r.status===401&&await refreshTok()){try{r=await raw(path,opt)}catch(e){throw new Error('Нет связи с сервером')}}
  if(r.status===401){logout();throw new Error('Сессия истекла, войдите заново')}
  if(r.status===403)throw new Error('Недостаточно прав для этого действия');
  if(!r.ok){var msg='Ошибка '+r.status;try{var j=await r.json();msg=j.detail||j.title||j.message||j.error||msg}catch(e){}throw new Error(msg)}
  if(r.status===204)return null;
  return (r.headers.get('content-type')||'').indexOf('json')>=0?r.json():null;
}

// ---------- кэш данных ----------
var cache={};
function dropCache(){cache={}}
async function cached(key,fn,ttl){
  var c=cache[key];if(c&&Date.now()-c.t<(ttl||60000))return c.v;
  var v=await fn();cache[key]={t:Date.now(),v:v};return v;
}
async function pagedAll(path,pageSize,maxPages){
  var all=[],total=0;
  for(var p=1;p<=maxPages;p++){
    var r=await api(path+(path.indexOf('?')>=0?'&':'?')+'page='+p+'&pageSize='+pageSize);
    total=r.totalCount;all=all.concat(r.items);
    if(all.length>=total||!r.items.length)break;
  }
  return {items:all,total:total};
}
function allOrders(){return cached('orders',function(){return pagedAll('/admin/orders',200,10)})}
function allUsers(){return cached('users',function(){return pagedAll('/admin/users',200,10)})}
function partners(){return cached('partners',function(){return api('/admin/partners')})}
function pendingReviews(){return cached('pend',function(){return api('/reviews/moderation').catch(function(){return []})},30000)}
function dashboard(){return cached('dash',function(){return api('/admin/dashboard')},30000)}
function catalogMap(){return cached('catmap',async function(){var r=await pagedAll('/admin/catalog/products',200,5);var m={};r.items.forEach(function(p){m[p.id]=p});return m},120000)}

function modal(html,onMount){
  var root=$('#modalRoot');root.innerHTML='<div class="modalbg"><div class="modal">'+html+'</div></div>';
  var bg=root.firstChild;bg.addEventListener('mousedown',function(e){if(e.target===bg)closeModal()});
  if(onMount)onMount(bg.firstChild);return bg.firstChild;
}
function closeModal(){$('#modalRoot').innerHTML=''}
function confirmBox(text,okLabel){
  return new Promise(function(res){
    var m=modal('<h2>Подтвердите</h2><p>'+esc(text)+'</p><div class="acts"><button class="btn ghost" id="cn">Отмена</button><button class="btn bad" id="cy">'+esc(okLabel||'Да')+'</button></div>');
    m.querySelector('#cn').onclick=function(){closeModal();res(false)};
    m.querySelector('#cy').onclick=function(){closeModal();res(true)};
  });
}
function pager(total,page,size,cb){
  var pages=Math.max(1,Math.ceil(total/size));var d=document.createElement('div');d.className='pager';
  d.innerHTML='<button class="btn ghost sm" '+(page<=1?'disabled':'')+'>←</button><span>Стр. '+page+' из '+pages+' · всего '+total+'</span><button class="btn ghost sm" '+(page>=pages?'disabled':'')+'>→</button>';
  var bs=d.querySelectorAll('button');bs[0].onclick=function(){cb(page-1)};bs[1].onclick=function(){cb(page+1)};return d;
}

// ---------- графики ----------
function compact(v){var a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(a>=1e7?0:1).replace('.0','')+'M';if(a>=1e3)return (v/1e3).toFixed(a>=1e4?0:1).replace('.0','')+'k';return String(Math.round(v*10)/10)}
function niceTop(max){
  if(max<=0)return 4;var raw=max/4,pow=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/pow;
  var m=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;var step=m*pow;return step*4;
}
function lineChart(pts,color,fmt){
  var W=360,H=220,L=40,R=16,T=12,B=26;
  var max=0;pts.forEach(function(p){if(p.v>max)max=p.v});
  var top=niceTop(max);
  var iw=W-L-R,ih=H-T-B,n=pts.length;
  function X(i){return L+(n<2?iw/2:i*iw/(n-1))}
  function Y(v){return T+ih-(v/top)*ih}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'">';
  for(var g=0;g<=4;g++){var gv=top*g/4,gy=Y(gv);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="#f2e1ce"/><text x="'+(L-6)+'" y="'+(gy+4)+'" text-anchor="end">'+esc(compact(gv))+'</text>'}
  var d='';pts.forEach(function(p,i){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)});
  s+='<path d="'+d+'L'+X(n-1).toFixed(1)+' '+Y(0)+'L'+X(0).toFixed(1)+' '+Y(0)+'Z" fill="'+color+'" opacity=".12"/><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linejoin="round"/>';
  var step=Math.ceil(n/5),rad=n>20?2:3;
  pts.forEach(function(p,i){
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+rad+'" fill="#fff" stroke="'+color+'" stroke-width="2"><title>'+esc(p.l)+': '+esc(fmt?fmt(p.v):num(p.v))+'</title></circle>';
    if(i%step===0&&i<=n-1-Math.ceil(step*0.8))s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(p.l)+'</text>';
  });
  s+='<text x="'+X(n-1).toFixed(1)+'" y="'+(H-7)+'" text-anchor="end">'+esc(pts[n-1].l)+'</text>';
  return s+'</svg>';
}
function daySeries(items,days,field,valueFn){
  var map={};days.forEach(function(d){map[dkey(d)]=0});
  items.forEach(function(it){var k=dkey(pd(it[field]));if(k in map)map[k]+=valueFn(it)});
  return days.map(function(d){return {l:dlabel(d),v:map[dkey(d)]}});
}
function isLive(o){return o.status!==4}

function inPeriod(o,days){if(!days)return true;var t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()-days+1);return pd(o.createdAt)>=t}

async function viewProducts(){
  await ensureCat();
  $('#main').innerHTML='<div class="bar"><input type="search" id="pS" placeholder="Поиск товара" value="'+esc(pq.search)+'"><button class="btn" id="pNew">+ Добавить товар</button></div><div id="pT"></div>';
  $('#pS').oninput=debounce(function(){pq.search=this.value.trim();pq.page=1;load()},350);
  $('#pNew').onclick=function(){editProduct(null)};
  async function load(){
    var r=await api('/admin/catalog/products?page='+pq.page+'&pageSize=20'+(pq.search?'&search='+encodeURIComponent(pq.search):''));
    var box=$('#pT');if(!box)return;var cn={};(cat.cats||[]).forEach(function(c){cn[c.id]=c.name});
    var rows=r.items.map(function(p){var img=(p.imageUrls&&p.imageUrls[0])?'<img class="th" loading="lazy" src="'+esc(p.imageUrls[0])+'" alt="">':'<div class="th"></div>';
      return '<tr class="click" data-id="'+esc(p.id)+'"><td>'+img+'</td><td><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.baseSku||'')+'</div></td><td>'+esc(cn[p.categoryId]||'')+'</td><td>'+esc(money(p.minPrice))+'</td><td>'+(p.isActive?'<span class="pill p3">Виден</span>':'<span class="pill poff">Скрыт</span>')+'</td></tr>'}).join('');
    box.innerHTML='<div class="tablewrap"><table><thead><tr><th></th><th>Товар</th><th>Категория</th><th>Цена от</th><th>Статус</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="muted">Товаров нет</td></tr>')+'</tbody></table></div>';
    box.appendChild(pager(r.totalCount,r.page,r.pageSize,function(p){pq.page=p;load()}));
    var map={};r.items.forEach(function(p){map[p.id]=p});
    box.querySelectorAll('tr.click').forEach(function(tr){tr.onclick=function(){editProduct(map[tr.dataset.id],load)}});
  }
  state.reloadProducts=load;await load();
}
function opts(list,sel,empty){return (empty?'<option value="">'+empty+'</option>':'')+list.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===sel?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')}
function varLine(v){v=v||{};return '<div class="line" data-v="'+esc(v.id||'')+'"><input placeholder="Размер" value="'+esc(v.size||'')+'"><input placeholder="Цвет" value="'+esc(v.color||'')+'"><input placeholder="Артикул (SKU)" value="'+esc(v.sku||'')+'"><input type="number" min="0" placeholder="Остаток" value="'+(v.stockQuantity==null?'':v.stockQuantity)+'"><button type="button" class="btn ghost sm rm">✕</button></div>'}
function tierLine(t){t=t||{};return '<div class="line t"><input type="number" min="1" placeholder="От (шт)" value="'+(t.minQuantity||'')+'"><input type="number" min="0" step="0.01" placeholder="Цена за шт" value="'+(t.pricePerUnit==null?'':t.pricePerUnit)+'"><button type="button" class="btn ghost sm rm">✕</button></div>'}
async function editProduct(p,reload){
  await ensureCat();reload=reload||state.reloadProducts;
  var isNew=!p;var det={variants:[],priceTiers:[]};
  if(p){try{det=await api('/catalog/products/'+p.id,{noAuth:true})}catch(e){return toast(e.message)}}
  p=p||{name:'',categoryId:(cat.cats[0]||{}).id,brandId:null,description:'',composition:'',baseSku:'',weightGrams:0,imageUrls:[],oldPrice:null,isNew:false,isHit:false,isActive:true};
  var m=modal('<h2>'+(isNew?'Новый товар':'Товар')+'</h2><label class="field"><span>Название</span><input id="fN" value="'+esc(p.name)+'"></label>'+
    '<div class="row2"><label class="field"><span>Категория</span><select id="fC">'+opts(cat.cats,p.categoryId)+'</select></label><label class="field"><span>Бренд</span><select id="fB">'+opts(cat.brands,p.brandId,'— без бренда —')+'</select></label></div>'+
    '<div class="row3"><label class="field"><span>Артикул (SKU)</span><input id="fS" value="'+esc(p.baseSku||'')+'"></label><label class="field"><span>Вес, г</span><input id="fW" type="number" min="0" value="'+(p.weightGrams||0)+'"></label><label class="field"><span>Старая цена</span><input id="fO" type="number" min="0" step="0.01" value="'+(p.oldPrice==null?'':p.oldPrice)+'"></label></div>'+
    '<label class="field"><span>Описание</span><textarea id="fD">'+esc(p.description||'')+'</textarea></label><label class="field"><span>Состав</span><input id="fCo" value="'+esc(p.composition||'')+'"></label>'+
    '<label class="field"><span>Ссылки на фото (по одной в строке; первая — главная)</span><textarea id="fI">'+esc((p.imageUrls||[]).join('\n'))+'</textarea></label>'+
    '<div class="chk"><label><input type="checkbox" id="fNew"'+(p.isNew?' checked':'')+'> Новинка</label><label><input type="checkbox" id="fHit"'+(p.isHit?' checked':'')+'> Хит</label>'+(isNew?'':'<label><input type="checkbox" id="fAct"'+(p.isActive?' checked':'')+'> Показывать в каталоге</label>')+'</div>'+
    '<div class="sbh">Оптовые цены (чем больше штук, тем ниже цена)</div><div id="tiers">'+(det.priceTiers||[]).map(tierLine).join('')+'</div><button type="button" class="btn ghost sm" id="addT">+ Ступень цены</button>'+
    '<div class="sbh">Варианты и остатки</div><div id="vars">'+(det.variants||[]).map(varLine).join('')+'</div><button type="button" class="btn ghost sm" id="addV">+ Вариант</button>'+
    '<div id="fErr" class="err hidden"></div><div class="acts">'+(isNew?'':'<button class="btn bad" id="fDel" style="margin-right:auto">Удалить</button>')+'<button class="btn ghost" id="fX">Отмена</button><button class="btn" id="fOk">Сохранить</button></div>');
  var removed=[];
  function bindRm(root){root.querySelectorAll('.rm').forEach(function(b){b.onclick=function(){var l=b.parentNode;if(l.dataset.v)removed.push(l.dataset.v);l.remove()}})}
  bindRm(m);
  m.querySelector('#addT').onclick=function(){var d=document.createElement('div');d.innerHTML=tierLine();var n=d.firstChild;m.querySelector('#tiers').appendChild(n);bindRm(n)};
  m.querySelector('#addV').onclick=function(){var d=document.createElement('div');d.innerHTML=varLine();var n=d.firstChild;m.querySelector('#vars').appendChild(n);bindRm(n)};
  m.querySelector('#fX').onclick=closeModal;
  var del=m.querySelector('#fDel');
  if(del)del.onclick=async function(){if(!await confirmBox('Удалить товар «'+p.name+'» навсегда? Лучше просто скрыть его из каталога.','Удалить'))return;try{await api('/admin/catalog/products/'+p.id,{method:'DELETE'});toast('Товар удалён');dropCache();if(reload)reload()}catch(e){toast(e.message)}};
  m.querySelector('#fOk').onclick=async function(){
    var er=m.querySelector('#fErr');er.classList.add('hidden');var btn=m.querySelector('#fOk');var name=m.querySelector('#fN').value.trim();
    if(!name){er.textContent='Укажите название';er.classList.remove('hidden');return}
    var tiers=[].map.call(m.querySelectorAll('#tiers .line'),function(l){var i=l.querySelectorAll('input');return {minQuantity:parseInt(i[0].value,10),pricePerUnit:parseFloat(i[1].value)}}).filter(function(t){return t.minQuantity>0&&t.pricePerUnit>=0});
    var vars=[].map.call(m.querySelectorAll('#vars .line'),function(l){var i=l.querySelectorAll('input');return {id:l.dataset.v||null,size:i[0].value.trim()||null,color:i[1].value.trim()||null,sku:i[2].value.trim(),stockQuantity:parseInt(i[3].value,10)||0}});
    if(vars.some(function(v){return !v.sku})){er.textContent='У каждого варианта нужен артикул (SKU)';er.classList.remove('hidden');return}
    var body={name:name,categoryId:m.querySelector('#fC').value,brandId:m.querySelector('#fB').value||null,description:m.querySelector('#fD').value.trim()||null,composition:m.querySelector('#fCo').value.trim()||null,baseSku:m.querySelector('#fS').value.trim(),weightGrams:parseInt(m.querySelector('#fW').value,10)||0,imageUrls:m.querySelector('#fI').value.split('\n').map(function(s){return s.trim()}).filter(Boolean),oldPrice:m.querySelector('#fO').value===''?null:parseFloat(m.querySelector('#fO').value),isNew:m.querySelector('#fNew').checked,isHit:m.querySelector('#fHit').checked};
    btn.disabled=true;btn.textContent='Сохраняем…';
    try{
      var id=p.id;
      if(isNew){var c=await api('/admin/catalog/products',{method:'POST',body:body});id=c.id}
      else{await api('/admin/catalog/products/'+id,{method:'PUT',body:body});var act=m.querySelector('#fAct').checked;if(act!==p.isActive)await api('/admin/catalog/products/'+id+'/active',{method:'PUT',body:{isActive:act}})}
      for(var k=0;k<removed.length;k++)await api('/admin/catalog/variants/'+removed[k],{method:'DELETE'});
      for(var j=0;j<vars.length;j++){var v=vars[j];var vb={size:v.size,color:v.color,sku:v.sku,stockQuantity:v.stockQuantity};if(v.id)await api('/admin/catalog/variants/'+v.id,{method:'PUT',body:vb});else await api('/admin/catalog/products/'+id+'/variants',{method:'POST',body:vb})}
      if(tiers.length||(det.priceTiers||[]).length)await api('/admin/catalog/products/'+id+'/price-tiers',{method:'PUT',body:{tiers:tiers}});
      closeModal();toast('Сохранено');dropCache();if(reload)reload();
    }catch(e){er.textContent=e.message;er.classList.remove('hidden');btn.disabled=false;btn.textContent='Сохранить'}
  };
}

// ---------- старт ----------
if(state.tok){var c0=jwt(state.tok.accessToken);if(c0.role==='Admin'||c0.role==='SuperAdmin')start();else logout()}else showLogin();
})();
</script>
</body>
</html>
