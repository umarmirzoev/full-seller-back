name: Deploy backend to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/FullSeller.WebApi/FullSeller.WebApi.csproj

      - name: Publish
        run: dotnet publish src/FullSeller.WebApi/FullSeller.WebApi.csproj -c Release -o publish_output

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Stop service
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "systemctl stop fullseller-backend"

      - name: Sync published build to VPS
        run: rsync -avz --delete publish_output/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}/

      - name: Start service
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "systemctl start fullseller-backend && systemctl is-active fullseller-backend"
